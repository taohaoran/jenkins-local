[project]
name = "python-fastapi-demo"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["."]
